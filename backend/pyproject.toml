[project]
name = "askdata"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "cryptography>=43",
  "sse-starlette>=2.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
agent = [
  "langgraph",
  "langgraph-checkpoint-postgres",
  "langchain-core",
  "sqlglot",
  "groq",
  "langchain-huggingface>=1.2.2",
]
ml = ["mem0ai", "sentence-transformers"]
engines = ["pymongo", "neo4j", "cassandra-driver", "elasticsearch", "pymysql", "pyodbc"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff",
    "mypy",
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
